# SonarQube Project Configuration
sonar.projectKey=llm-test-automation
sonar.projectName=LLM Test Automation Suite
sonar.projectVersion=1.0

# Source directories and language inclusions
sonar.sources=.
sonar.inclusions=tests/**/*.py,utils/**/*.py,conftest.py,run_tests.py,generate_tests.py

# Exclude generated artifacts, logs, virtual environments, and HTML reports
sonar.exclusions=reports/**,test-results/**,logs/**,.venv/**,__pycache__/**

# Environment settings
sonar.sourceEncoding=UTF-8
