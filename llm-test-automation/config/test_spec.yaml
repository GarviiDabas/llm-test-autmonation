# ---------------------------------------------------------------------------
# test_spec.yaml
# Minimal configuration.
# The LLM autonomously derives test scenarios from dynamically gathered UI + API context.
# Code generation rules live in config/system_prompt.txt — NOT here.
# ---------------------------------------------------------------------------

project:
  name: "eventhub"
  display_name: "EventHub — Discover & Book Events"
  environment: "staging"

target:
  ui_url:      "https://eventhub.rahulshettyacademy.com"
  login_url:   "https://eventhub.rahulshettyacademy.com/login"
  api_url:     "https://api.eventhub.rahulshettyacademy.com/api"

credentials:
  username_env: "TEST_USERNAME"
  password_env: "TEST_PASSWORD"

constraints:
  - "Admin UI flows (create, edit, delete events) are out of scope for this suite"
  - "For payment, event details, booking details use test and sandbox data"
  - "All destructive test actions must target staging only — never production"
  - "Do not modify or delete events or bookings created by other users"
