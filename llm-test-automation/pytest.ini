[pytest]
addopts = --screenshot=only-on-failure --video=retain-on-failure --tracing=retain-on-failure --html=generated/reports/report.html --self-contained-html --css=config/report_style.css
testpaths = generated/tests

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s:%(lineno)d | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
