[pytest]
addopts = --screenshot=only-on-failure --video=retain-on-failure --tracing=retain-on-failure
testpaths = tests

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s:%(lineno)d | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest_execution.log
log_file_level = DEBUG
log_file_format = %(asctime)s | %(levelname)-8s | %(name)s:%(lineno)d | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

