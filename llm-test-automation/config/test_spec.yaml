# ---------------------------------------------------------------------------
# Test Spec: Structured prompt and domain specification for test generation.
# Adheres to Single Responsibility Principle (SRP) by separating Concerns:
# Project Metadata, Framework Config, Engineering Rules, Coverage Spec,
# Guardrails, API Manifest, and Output Config.
# ---------------------------------------------------------------------------

project_metadata:
  project_name: "eventhub"
  display_name: "EventHub Test Automation Suite"
  environment: "staging"
  target_urls:
    ui_base_url_env: "UI_BASE_URL"
    login_url_env: "LOGIN_URL"
    api_base_url_env: "API_BASE_URL"

  auth_credentials:
    type: "form_login"
    username_env: "TEST_USERNAME"
    password_env: "TEST_PASSWORD"

framework_config:
  ui_framework: "playwright-python"
  api_framework: "requests+pytest"
  test_runner: "pytest"
  assertion_style: "pytest+expect"

code_generation_rules:
  playwright_rules:
    - "This is PYTHON Playwright. All assertions MUST use snake_case: to_be_visible(), to_have_url(), to_have_value(), to_be_enabled(), to_be_disabled(). NEVER use camelCase JS-style method names like toBeVisible() or toHaveURL()."
    - "`page` is a fixture, not an importable name. NEVER write `from playwright.sync_api import page`. The only valid imports from playwright.sync_api are `Page` (capital P for type hints) and `expect`."
    - "Use re.compile(...) when asserting URLs or button text regexes: expect(page).to_have_url(re.compile(r'/dashboard'))."

  locator_strategy:
    - "Strict locator preference order: data-testid > role/aria-label > id > name > text."
    - "If a locator appears multiple times on a page (e.g. repeated cards/items), disambiguate using .filter(has_text='...') or .nth(index)."
    - "Never guess CSS selectors or element IDs that are not present in the supplied UI context."

  api_rules:
    - "For POST /bookings requests, always provide all required fields: customerName, customerEmail, customerPhone, quantity, and eventId."
    - "Obtain a fresh Bearer token via POST /auth/register or POST /auth/login for endpoints requiring auth."
    - "Assert HTTP status code AND response payload structure for every endpoint call."

  constants_and_security:
    - "All base URLs, default headers, endpoints, and credentials MUST be imported from `utils.constants` or supplied via `conftest.py` fixtures."
    - "Do not hardcode unencrypted secrets, passwords, or raw hostnames inside individual test functions."

  naming_conventions:
    - "All test files and manifests must use PEP 8 snake_case naming (e.g. `test_eventhub.py`, `eventhub_manifest.json`, `constants.py`)."
    - "Test functions must start with `test_` followed by lower_snake_case describing category and outcome (e.g., `test_auth_login_positive_valid_credentials`, `test_auth_login_negative_invalid_password`, `test_bookings_edge_empty_quantity`)."

  code_quality:
    - "Group related tests into logical classes named Test<Feature> (e.g., TestAuthAPI, TestEventsAPI, TestBookingsAPI, TestEventHubUI)."
    - "Write clear, descriptive docstrings for every test function stating what is verified and expected behavior."
    - "Use unique emails and identifiers via `uuid.uuid4().hex[:6]` to ensure tests remain completely independent."

